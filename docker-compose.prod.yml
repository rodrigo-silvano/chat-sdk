version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat_sdk}
      POSTGRES_USER: ${POSTGRES_USER:-chat_sdk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat_sdk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-chat_sdk}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-chat_sdk}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORT: '3000'
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT:-5173}:5173'
    environment:
      NODE_ENV: production
      VITE_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

  widget:
    build:
      context: .
      dockerfile: apps/widget/Dockerfile
    restart: unless-stopped
    ports:
      - '${WIDGET_PORT:-5174}:5174'
    environment:
      NODE_ENV: production
      VITE_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
