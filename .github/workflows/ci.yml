name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_sdk_test
          POSTGRES_USER: chat_sdk
          POSTGRES_PASSWORD: chat_sdk_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Install pnpm globally
        run: npm install -g pnpm@9.15.0

      - name: Add pnpm to PATH
        run: echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://chat_sdk:chat_sdk_test@localhost:5432/chat_sdk_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_1234567890abcdef1234567890abcdef
          JWT_REFRESH_SECRET: test_refresh_secret_1234567890abcdef1234567890abcdef
          ENCRYPTION_KEY: test_encryption_key_1234567890abcdef1234567890ab
          NODE_ENV: test
          PORT: 3000

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push API Docker image
        if: github.event_name != 'pull_request' && secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/chat-sdk-api:latest,${{ secrets.DOCKER_HUB_USERNAME }}/chat-sdk-api:${{ github.sha }}

      - name: Build and push Admin Docker image
        if: github.event_name != 'pull_request' && secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/chat-sdk-admin:latest,${{ secrets.DOCKER_HUB_USERNAME }}/chat-sdk-admin:${{ github.sha }}

      - name: Build and push Widget Docker image
        if: github.event_name != 'pull_request' && secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/widget/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/chat-sdk-widget:latest,${{ secrets.DOCKER_HUB_USERNAME }}/chat-sdk-widget:${{ github.sha }}
